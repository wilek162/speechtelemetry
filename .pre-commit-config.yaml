repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]  # Prevent accidental model weights or media commits
      - id: detect-private-key
      - id: check-ast  # Syntax-check all Python files before committing

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Custom hooks: reject hardcoded credentials
  - repo: local
    hooks:
      - id: no-hf-tokens
        name: Reject hardcoded HuggingFace tokens
        language: pygrep
        entry: 'hf_[a-zA-Z0-9]{20,}'
        types: [python]
        exclude: ^tests/

      - id: no-openai-keys
        name: Reject hardcoded OpenAI API keys
        language: pygrep
        entry: 'sk-[a-zA-Z0-9]{32,}'
        types: [python]
        exclude: ^tests/

      - id: no-hardcoded-env-secrets
        name: Reject os.environ assignments to tokens/secrets in source
        language: pygrep
        entry: 'os\.environ\s*\[.*(TOKEN|SECRET|KEY|PASSWORD).*\]\s*='
        types: [python]
        exclude: ^tests/
