repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]  # Prevent accidental model weight commits

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  # Custom hook: reject hardcoded HuggingFace tokens
  - repo: local
    hooks:
      - id: no-hf-tokens
        name: Reject hardcoded HuggingFace tokens
        language: pygrep
        entry: 'hf_[a-zA-Z0-9]{20,}'
        types: [python]
        exclude: tests/fixtures/
