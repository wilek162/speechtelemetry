[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speechtelemetry"
version = "0.1.0"
description = "Local-first speech intelligence: transcription, prosody, diarization, and emotion enrichment"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "speechtelemetry contributors" }]
keywords = ["speech", "transcription", "prosody", "emotion", "diarization", "nlp", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# CRITICAL: Core deps ONLY. No ML libraries here.
# All ML backends are optional extras.
dependencies = [
    "pydantic>=2.0",
    "soundfile>=0.12",
    "typing_extensions>=4.0; python_version<'3.11'",
]

[project.optional-dependencies]
asr     = ["faster-whisper>=1.0"]
align   = ["whisperx>=3"]
vad     = ["silero-vad>=5", "torchaudio>=2.0"]
diarize = ["pyannote.audio>=3.1"]
prosody = ["praat-parselmouth>=0.4", "copasul>=1.0"]
emotion = ["speechbrain>=1.0", "transformers>=4.30"]
cli     = ["typer[all]>=0.9", "rich>=13"]
# GPU extras: install CUDA-enabled torch BEFORE installing speechtelemetry[cuda].
# See docs/developer_reference.md for the correct --index-url for your CUDA version.
# Example: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu121
cuda    = ["speechtelemetry[asr,align,vad,emotion]"]

# Convenience bundles
default = ["speechtelemetry[asr,align,vad,emotion,cli]"]
all     = ["speechtelemetry[asr,align,vad,diarize,prosody,emotion,cli]"]
dev     = [
    "speechtelemetry[all]",
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.8",
    "ruff>=0.4",
    "pre-commit>=3",
]

[project.scripts]
speechtelemetry = "speechtelemetry.cli.main:main"

# Entry point group for third-party backend auto-discovery
[project.entry-points."speechtelemetry.backends"]
# populated by third-party packages, not by this project

[project.urls]
Homepage = "https://github.com/speechtelemetry/speechtelemetry"
Documentation = "https://github.com/speechtelemetry/speechtelemetry/tree/main/docs"
Repository = "https://github.com/speechtelemetry/speechtelemetry"
Issues = "https://github.com/speechtelemetry/speechtelemetry/issues"
Changelog = "https://github.com/speechtelemetry/speechtelemetry/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/speechtelemetry"]

# ── Ruff (linter) ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]
exclude = ["files_miscellanous"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

# ── Mypy (type checker) ────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "whisperx.*",
    "parselmouth.*",
    "pyannote.*",
    "speechbrain.*",
    "silero_vad.*",
    "copasul.*",
    "librosa.*",
    "soundfile.*",
]
ignore_missing_imports = true

# ── Pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --tb=short"
markers = [
    "gpu: marks tests that require a CUDA GPU (deselect with -m 'not gpu')",
    "hf_token: marks tests that require HF_TOKEN env var",
    "slow: marks slow integration/e2e tests",
]
log_level = "DEBUG"
log_cli_level = "WARNING"

# ── Coverage ───────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/speechtelemetry"]
omit = ["*/tests/*", "*/benchmarking/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
